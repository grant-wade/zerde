name: Zig

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: ${{ matrix.os }}, Zig ${{ matrix.zig }}
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          - freebsd-15.1
        include:
          - os: freebsd-15.1
            runner: [self-hosted, freebsd, p1-freebsd]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: grant-wade/zig-setup@v1.0.1
        with:
          version: ${{ matrix.zig }}

      - name: Show Zig version
        run: zig version

      - name: Build and test
        run: zig build test examples docs check-tools --summary all
