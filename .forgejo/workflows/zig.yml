name: Zig

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Zig ${{ matrix.zig }}
    runs-on: zig-ci
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2.2.1
        with:
          version: ${{ matrix.zig }}
          use-cache: false

      - name: Show Zig version
        run: zig version

      - name: Build and test
        run: zig build test examples docs check-tools --summary all
